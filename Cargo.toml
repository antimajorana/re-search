[workspace]
resolver = "2"
members = ["crates/policy", "crates/ledger", "crates/tools", "crates/worker", "crates/mcp-server", "crates/cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
getrandom = "0.2"
