name: Workbench checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  file-length:
    name: Touched source files stay within 600 lines
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the rule itself
        run: python3 scripts/check_file_length.py --self-test
      - name: Check the files this pull request touches
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_file_length.py --base "origin/$BASE_REF"
  windows:
    name: Research workflows on Windows
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check interface logic
        run: |
          $tests = (Get-ChildItem crates/desktop-server/tests/*.test.mjs).FullName
          node --test @tests
      - name: Prepare and test the packaged math runtime
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'math-runtime'
          python packaging/windows/stage_runtime.py --output $runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $worker = Join-Path $runtime 'python.exe'
          "RE_SEARCH_PYTHON=$worker" >> $env:GITHUB_ENV
          & $worker -m unittest discover -s python
      - name: Test the Rust workspace and worker integrations
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup override set 1.100.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --workspace --no-fail-fast
      - name: Exercise the workbench in Chromium
        run: |
          $env:RESEARCH_GRAPH_SCREENSHOTS = Join-Path $env:RUNNER_TEMP 'research-graph-views'
          python -m pip install playwright
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m playwright install chromium --only-shell
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python crates/desktop-server/tests/workbench_browser.py
      - name: Keep the tested graph views
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-graph-views
          path: ${{ runner.temp }}/research-graph-views/*.png
          if-no-files-found: ignore
          retention-days: 7
