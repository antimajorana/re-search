name: Workbench checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Research workflows on Windows
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check interface logic
        run: |
          $tests = (Get-ChildItem crates/desktop-server/tests/*.test.mjs).FullName
          node --test @tests
      - name: Prepare and test the packaged math runtime
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'math-runtime'
          python packaging/windows/stage_runtime.py --output $runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $worker = Join-Path $runtime 'python.exe'
          "RE_SEARCH_PYTHON=$worker" >> $env:GITHUB_ENV
          & $worker -m unittest discover -s python
      - name: Test the Rust workspace and worker integrations
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup override set 1.100.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --workspace --no-fail-fast
      - name: Exercise the workbench in Chromium
        run: |
          python -m pip install playwright
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m playwright install chromium --only-shell
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python crates/desktop-server/tests/workbench_browser.py
