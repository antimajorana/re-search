[package]
name = "desktop-app"
description = "re:Search desktop window: one process hosting the loopback server and a locked-down WebView2 window."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "re-search-app"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
desktop-server = { path = "../desktop-server" }
research-tools = { path = "../research-tools" }
wry = { version = "=0.57.3", default-features = false }
tao = { version = "=0.37.3", default-features = false, features = ["rwh_06"] }
# The same `windows` version wry/tao already pull in (no second copy).
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }
