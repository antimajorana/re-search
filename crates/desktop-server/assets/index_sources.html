        <!-- Tab 3: Literature & Sources Canvas -->
        <section id="panel-sources" class="canvas-panel" role="tabpanel" aria-labelledby="tab-sources">
          <div class="sources-layout">
            <h3 class="rail-section-label" style="margin:0;padding:2px 0;">Sources Used</h3>
            <div id="used-sources-list" style="display:flex;flex-direction:column;gap:8px;"></div>
            <details class="dag-detail-card formal-library">
              <summary>Formal library</summary>
              <form id="formal-library-form" autocomplete="off">
                <label for="formal-library-query">Lean declaration</label>
                <div class="formal-library-controls">
                  <input id="formal-library-query" class="text-input" type="search" maxlength="160" placeholder="Name or keywords" required disabled>
                  <button type="submit" class="pill-btn sm primary" disabled>Search Physlib</button>
                </div>
              </form>
              <div id="formal-library-status" role="status"></div>
              <div id="formal-library-results"></div>
            </details>
            <form id="literature-search-form" class="dag-detail-card" autocomplete="off">
              <div style="display:flex;gap:6px;margin-bottom:8px;">
                <select id="lit-source-select" class="compact-select" aria-label="Literature database">
                  <option value="arxiv">arXiv</option>
                  <option value="inspire">INSPIRE-HEP</option>
                  <option value="crossref">Crossref</option>
                  <option value="semantic_scholar">Semantic Scholar</option>
                </select>
                <input id="lit-query-input" class="text-input" type="search" aria-label="Search for papers" placeholder="Title, author, or identifier" required>
                <button id="lit-search-btn" type="submit" class="pill-btn sm primary">Search</button>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;">
                <select id="lit-field-select" class="compact-select" aria-label="arXiv search field">
                  <option value="all">Field: All</option>
                  <option value="title">Title</option>
                  <option value="author">Author</option>
                  <option value="abstract">Abstract</option>
                  <option value="id">arXiv ID</option>
                </select>
                <label style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;">
                  <input id="lit-include-source" type="checkbox"> Save TeX source
                </label>
                <input id="lit-section-filter" class="text-input" type="text" aria-label="Filter paper sections" placeholder="Filter sections" style="width:128px;height:28px;">
              </div>
            </form>
            <div id="literature-results" style="display:flex;flex-direction:column;gap:8px;"></div>
            <details id="session-literature" class="dag-detail-card" hidden>
              <summary>Search History</summary>
              <div id="session-literature-list" style="display:flex;flex-direction:column;gap:8px;margin-top:8px;"></div>
            </details>
            <div class="dag-detail-card paper-passage-search">
              <form id="paper-passage-form" autocomplete="off">
                <label for="paper-passage-query">Search ingested paper passages</label>
                <div class="paper-passage-controls">
                  <input id="paper-passage-query" class="text-input" type="search" maxlength="512" placeholder="Claim or distinctive terms" required>
                  <button type="submit" class="pill-btn sm primary">Find passages</button>
                </div>
              </form>
              <div id="paper-passage-status" role="status"></div>
              <div id="paper-passage-results"></div>
            </div>
            <h3 class="rail-section-label" style="margin:0;padding:2px 0;">Saved files</h3>
            <div id="sources-list" style="display:flex;flex-direction:column;gap:8px;"></div>
          </div>
        </section>
