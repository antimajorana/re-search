[package]
name = "desktop-server"
description = "Loopback HTTP + SSE desktop host, UI approval broker, and embedded Gemini-inspired research UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
policy = { path = "../policy" }
ledger = { path = "../ledger" }
tools = { path = "../tools" }
research-tools = { path = "../research-tools" }
agent = { path = "../agent" }
export = { path = "../export" }
worker = { path = "../worker" }
cli-route = { path = "../cli-route" }
chatgpt-auth = { path = "../chatgpt-auth" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
httparse = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[dev-dependencies]
cli-route = { path = "../cli-route", features = ["testkit"] }
chatgpt-auth = { path = "../chatgpt-auth", features = ["testkit"] }
tempfile = { workspace = true }
ureq = { workspace = true }
